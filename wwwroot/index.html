<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Notebook</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Task Notebook</h1>

    <!-- View 1: login / sign up -->
    <section id="auth-view" hidden>
      <div class="tabs" role="tablist">
        <button id="tab-login" class="active" type="button">Log in</button>
        <button id="tab-signup" type="button">Sign up</button>
      </div>
      <div class="panel">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password">
        <p id="auth-error" class="error" role="alert"></p>
        <button id="auth-submit" class="primary" type="button">Log in</button>
      </div>
    </section>

    <!-- View 2: the task list -->
    <section id="app-view" hidden>
      <div class="bar">
        <span id="who"></span>
        <button id="logout" type="button">Log out</button>
      </div>
      <div class="panel">
        <input id="task-title" placeholder="What needs doing?">
        <textarea id="task-notes" rows="2" placeholder="Notes (optional)"></textarea>
        <button id="task-save" class="primary" type="button">Add task</button>
        <button id="task-cancel" type="button" hidden>Cancel edit</button>
        <p id="app-error" class="error" role="alert"></p>
      </div>
      <ul id="task-list"></ul>
      <p id="empty" hidden>No tasks yet. Add your first one above.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
